<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Product Aanpassen</title>
</head>

<body>
    <div class="container">
        <h1>✏️ Product Aanpassen</h1>

        <div class="add-product-card">
            <h2>Product Bewerken</h2>
            <div class="form-group">
                <input type="text" id="name" placeholder="Productnaam">
                <input type="number" id="price" placeholder="Prijs (€)" step="0.01" min="0">
            </div>
            <button class="btn-add" id="update_button">💾 Opslaan</button>
            <button class="btn-cancel" id="back_button">❌ Annuleren</button>
        </div>
    </div>

    <script src="script_edit.js">

    </script>
</body>

</html>
